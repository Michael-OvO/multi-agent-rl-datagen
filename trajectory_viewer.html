<script>
"use strict";

/* ================= state & plumbing ================= */

const $ = (sel, el) => (el || document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* sessions: {name, path, data, kind}  kind: episode | breakdown | sweep | raw */
const sessions = [];
const manualArtifacts = new Map();
let liveHandle = null;
let liveCache = new Map();
let liveRefresh = null;
let lastLiveLoad = 0;
let liveRootReady = false;
let liveNeedsPermission = false;
let pickingRepository = false;
let tab = "runs";          // runs | breakdowns | sweeps
let detail = null;         // session index, or null for the section view
let sweepSel = 0;
let savedScroll = 0;

function detect(data) {
  if (data && data.kind === "gaia2-episode") return "episode";
  if (data && Array.isArray(data.ledger)) return "breakdown";
  if (Array.isArray(data) && data.length && typeof data[0] === "object") return "sweep";
  if (data && Array.isArray(data.rows) && data.rows.length
      && typeof data.rows[0] === "object") return "sweep";
  return "raw";
}

function addSession(name, path, data) {
  const artifactPath = path || name;
  const prior = sessions.findIndex(s => s.path === artifactPath);
  if (prior >= 0) sessions.splice(prior, 1);
  sessions.push({name, path: artifactPath, data, kind: detect(data)});
}

function sortSessions() {
  const order = {episode: 0, breakdown: 1, sweep: 2, raw: 3};
  sessions.sort((a, b) => (order[a.kind] - order[b.kind])
    || String(a.path).localeCompare(String(b.path)));
}

const byKind = kind => sessions.filter(s => s.kind === kind);
const shortScenario = id => String(id).replace(/^scenario_universe_/, "");

/* ---- live repository + supplementary manual files ---- */

const JSON_FILE = /\.json$/i;
const DB_NAME = "trajectory-evidence";
const DB_STORE = "handles";
const DB_KEY = "repository";

function artifact(name, path, data) {
  return {name, path, data};
}

function activateArtifacts(artifacts) {
  const detailPath = detail === null ? null : sessions[detail]?.path;
  sessions.length = 0;
  for (const a of artifacts) addSession(a.name, a.path, a.data);
  for (const a of manualArtifacts.values()) addSession(a.name, a.path, a.data);
  sortSessions();
  if (detailPath !== null) {
    const next = sessions.findIndex(s => s.path === detailPath);
    detail = next < 0 ? null : next;
  }
}

async function addFiles(fileList) {
  let added = 0;
  for (const f of [...fileList].filter(f => JSON_FILE.test(f.name))) {
    const path = f.webkitRelativePath || f.name;
    let data;
    try { data = JSON.parse(await f.text()); } catch { continue; }
    const a = artifact(f.name, path, data);
    manualArtifacts.set(path, a);
    addSession(a.name, a.path, a.data);
    added++;
  }
  const prior = sessions.length - added;
  if (fileList.length && !added) {
    sourceLine = prior
      ? `${sourceLine}; a further pick matched nothing`
      : "the picked selection held no readable artifacts";
  } else if (added && prior) {
    sourceLine = `${sourceLine}, plus ${added} picked`;
  } else if (added) {
    sourceLine = `picked files — ${added} artifacts`;
  }
  sortSessions(); render();
}
$("#pick").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
for (const ev of ["dragover", "dragleave", "drop"]) {
  document.body.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === "drop") addFiles(e.dataTransfer.files);
  });
}

function relativeRepoPath(rawPath) {
  const parts = String(rawPath).split("/").filter(Boolean);
  const root = parts.findIndex(p => ["output", "sweep", "jobs"].includes(p));
  return root < 0 ? null : parts.slice(root).join("/");
}

function wantedRepoPath(path) {
  const parts = String(path).split("/");
  return (
    parts.length === 3
    && parts[0] === "output"
    && parts[1] === "rollouts"
    && JSON_FILE.test(parts[2])
  ) || (
    parts.length === 2
    && parts[0] === "sweep"
    && JSON_FILE.test(parts[1])
  ) || (
    parts.length >= 4
    && parts[0] === "jobs"
    && parts.at(-2) === "verifier"
    && parts.at(-1) === "breakdown.json"
  );
}

function artifactCounts(artifacts) {
  return {
    rollouts: artifacts.filter(a => a.path.startsWith("output/rollouts/")).length,
    sweeps: artifacts.filter(a => a.path.startsWith("sweep/")).length,
    breakdowns: artifacts.filter(a => a.path.startsWith("jobs/")).length,
  };
}

function countLine(counts) {
  return `${counts.rollouts} trajectories · ${counts.sweeps} sweeps · `
    + `${counts.breakdowns} breakdowns`;
}

async function loadFallbackFolder(fileList) {
  const artifacts = [];
  for (const f of fileList) {
    const path = relativeRepoPath(f.webkitRelativePath || f.name);
    if (!path || !wantedRepoPath(path)) continue;
    try {
      artifacts.push(artifact(f.name, path, JSON.parse(await f.text())));
    } catch { /* An unreadable JSON file is not an artifact. */ }
  }
  activateArtifacts(artifacts);
  const counts = artifactCounts(artifacts);
  const complete = counts.rollouts > 0 && counts.sweeps > 0
    && counts.breakdowns > 0;
  sourceLine = complete
    ? `live folder selection — ${countLine(counts)}`
    : `partial folder selection — ${countLine(counts)}; select the `
      + "multi-agent-rl-datagen repository root";
  $("#connect").textContent = complete
    ? "choose another repository folder"
    : "choose repository root";
  render();
}

$("#folderpick").addEventListener("change", e => {
  loadFallbackFolder(e.target.files);
  e.target.value = "";
});

function openHandleDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(DB_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function savedHandle() {
  try {
    const db = await openHandleDb();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const request = tx.objectStore(DB_STORE).get(DB_KEY);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
      tx.oncomplete = () => db.close();
    });
  } catch { return null; }
}

async function rememberHandle(handle) {
  try {
    const db = await openHandleDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(handle, DB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch { /* Live loading still works for this page view. */ }
}

async function hasReadPermission(handle, request = false) {
  const options = {mode: "read"};
  if (await handle.queryPermission(options) === "granted") return true;
  return request && await handle.requestPermission(options) === "granted";
}

async function childDirectory(root, names) {
  let current = root;
  try {
    for (const name of names) current = await current.getDirectoryHandle(name);
    return current;
  } catch { return null; }
}

async function readHandle(handle, path, nextCache) {
  try {
    const file = await handle.getFile();
    const stamp = `${file.lastModified}:${file.size}`;
    const prior = liveCache.get(path);
    if (prior && prior.stamp === stamp) {
      nextCache.set(path, prior);
      return prior.artifact;
    }
    const a = artifact(file.name, path, JSON.parse(await file.text()));
    nextCache.set(path, {stamp, artifact: a});
    return a;
  } catch { return null; }
}

async function scanFlatJson(dir, prefix, artifacts, nextCache) {
  if (!dir) return;
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind !== "file" || !JSON_FILE.test(name)) continue;
    const path = `${prefix}/${name}`;
    const a = await readHandle(handle, path, nextCache);
    if (a) artifacts.push(a);
  }
}

async function scanJobs(dir, parts, artifacts, nextCache) {
  for await (const [name, handle] of dir.entries()) {
    const next = [...parts, name];
    if (handle.kind === "directory") {
      await scanJobs(handle, next, artifacts, nextCache);
    } else if (
      name === "breakdown.json"
      && parts.at(-1) === "verifier"
    ) {
      const path = next.join("/");
      const a = await readHandle(handle, path, nextCache);
      if (a) artifacts.push(a);
    }
  }
}

async function scanRepository(root) {
  const artifacts = [];
  const nextCache = new Map();
  let repository = root;
  let rollouts = await childDirectory(repository, ["output", "rollouts"]);
  let sweeps = await childDirectory(repository, ["sweep"]);
  let jobs = await childDirectory(repository, ["jobs"]);

  /* Selecting the parent GitHub folder is a common Finder mistake. Safely
     descend when the repository is immediately inside it. */
  if (!rollouts && !sweeps && !jobs) {
    const nested = await childDirectory(
      repository, ["multi-agent-rl-datagen"]);
    if (nested) {
      repository = nested;
      rollouts = await childDirectory(repository, ["output", "rollouts"]);
      sweeps = await childDirectory(repository, ["sweep"]);
      jobs = await childDirectory(repository, ["jobs"]);
    }
  }

  const repositoryRoot = Boolean(rollouts && sweeps && jobs);

  /* Partial selections are readable for diagnosis, but they are never
     mistaken for or remembered as the complete repository. */
  if (!rollouts && root.name === "rollouts") rollouts = root;
  if (!rollouts && root.name === "output") {
    rollouts = await childDirectory(root, ["rollouts"]);
  }
  if (!sweeps && root.name === "sweep") sweeps = root;
  if (!jobs && root.name === "jobs") jobs = root;

  await scanFlatJson(
    rollouts, "output/rollouts", artifacts, nextCache);
  await scanFlatJson(sweeps, "sweep", artifacts, nextCache);
  if (jobs) await scanJobs(jobs, ["jobs"], artifacts, nextCache);
  liveCache = nextCache;
  artifacts.sort((a, b) => a.path.localeCompare(b.path));
  return {
    artifacts,
    counts: artifactCounts(artifacts),
    repositoryRoot,
    repositoryName: repository.name,
  };
}

async function refreshRepository(requestPermission = false) {
  if (!liveHandle) return;
  if (liveRefresh) return liveRefresh;
  liveRefresh = (async () => {
    if (!await hasReadPermission(liveHandle, requestPermission)) {
      liveNeedsPermission = true;
      sourceLine = "saved repository needs permission — click reconnect repository";
      $("#connect").textContent = "reconnect repository";
      render();
      return;
    }
    liveNeedsPermission = false;
    $("#connect").textContent = "reading repository…";
    const result = await scanRepository(liveHandle);
    liveRootReady = result.repositoryRoot;
    activateArtifacts(result.artifacts);
    lastLiveLoad = Date.now();
    const clock = new Date().toLocaleTimeString([], {
      hour: "2-digit", minute: "2-digit", second: "2-digit",
    });
    sourceLine = liveRootReady
      ? `live ${result.repositoryName} at ${clock} — ${countLine(result.counts)}`
      : `partial folder ${liveHandle.name} — ${countLine(result.counts)}; `
        + "select the multi-agent-rl-datagen repository root";
    $("#connect").textContent = liveRootReady
      ? "choose another repository folder"
      : "choose repository root";
    render();
    return result;
  })().catch(error => {
    sourceLine = `repository read failed — ${error.message || error}`;
    $("#connect").textContent = "reconnect repository";
    render();
  }).finally(() => { liveRefresh = null; });
  return liveRefresh;
}

async function connectRepository() {
  if (!("showDirectoryPicker" in window)) {
    $("#folderpick").click();
    return;
  }
  try {
    if (liveHandle && liveNeedsPermission
        && await hasReadPermission(liveHandle, true)) {
      await refreshRepository(false);
      return;
    }
    pickingRepository = true;
    const chosen = await window.showDirectoryPicker({
      id: "multi-agent-rl-datagen",
      mode: "read",
      startIn: "documents",
    });
    pickingRepository = false;
    liveHandle = chosen;
    liveCache = new Map();
    liveRootReady = false;
    liveNeedsPermission = false;
    const result = await refreshRepository(false);
    if (result?.repositoryRoot) await rememberHandle(liveHandle);
  } catch (error) {
    pickingRepository = false;
    if (error.name !== "AbortError") {
      sourceLine = `repository connection failed — ${error.message || error}`;
      render();
    }
  }
}

$("#connect").onclick = connectRepository;

/* A snapshot remains a zero-permission fallback. A connected repository is
   the primary source and replaces it with the files that exist right now. */
let sourceLine = "no data loaded";

$("#theme").onclick = () => {
  const dark = getComputedStyle(document.body).colorScheme.includes("dark");
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && detail !== null) return closeDetail();
  // Every mark, row, and sort head is keyboard-actionable: the same
  // focus-visible outline, Enter or Space to follow.
  if ((e.key === "Enter" || e.key === " ") && e.target instanceof Element
      && e.target.matches(".xref, tr.click, th.sortable, label[for=pick]")) {
    e.preventDefault();
    e.target.click();
  }
});

/* ================= shared pieces ================= */

function batchAppend(parent, nodes) {
  let i = 0;
  (function step() {
    const frag = document.createDocumentFragment();
    for (const end = Math.min(i + 80, nodes.length); i < end; i++) frag.appendChild(nodes[i]);
    parent.appendChild(frag);
    if (i < nodes.length) requestAnimationFrame(step);
  })();
}

const fmtWhen = t => t ? String(t).slice(5, 16) : "—";

function countMalformed(d) {
  let n = typeof d.malformed === "number" ? d.malformed : 0;
  if (n) return n;
  for (const e of d.events || []) {
    if (e.type === "call" && e.status === "malformed") n++;
    if (e.type === "delegation")
      for (const c of e.calls || []) if (c.status === "malformed") n++;
  }
  return n;
}

/* Verdicts are typeset, not badged. The dagger marks the official soft
   judge; the table note explains it, as a paper would. */
function verdictText(ok, judge) {
  const dag = judge && judge !== "scripted" ? `<span class="dag">†</span>` : "";
  return ok ? `<span class="yes">✓ success${dag}</span>`
            : `<span class="no">✗ failure${dag}</span>`;
}

function openDetail(i) {
  savedScroll = window.scrollY || 0;
  detail = i;
  render();
  window.scrollTo(0, 0);
}
function closeDetail() {
  detail = null;
  render();
  window.scrollTo(0, savedScroll);
}

/* ================= top-level render ================= */

const SECTIONS = [["runs", "Runs"], ["breakdowns", "Shipped-task runs"],
                  ["sweeps", "Evidence files"]];

function render() {
  $("#draftline").innerHTML = `multi-agent-rl-datagen — ${esc(sourceLine)}`;

  const nav = $("#contents");
  nav.innerHTML = "";
  SECTIONS.forEach(([key, label], i) => {
    const a = document.createElement("a");
    a.className = "item xref" + (key === tab && detail === null ? " on" : "");
    a.tabIndex = 0;
    a.textContent = label;
    a.onclick = () => { tab = key; detail = null; render(); };
    nav.appendChild(a);
  });
  nav.style.display = sessions.length ? "" : "none";

  const content = $("#content");
  content.innerHTML = "";
  /* restart the settle animation on each navigation */
  content.style.animation = "none";
  void content.offsetWidth;
  content.style.animation = "";

  if (!sessions.length) {
    content.innerHTML = `<div class="abstract">
      <h2>No artifacts loaded</h2>
      <p>Choose <i>connect repository</i> once and select the
      <code>multi-agent-rl-datagen</code> folder. The viewer will read its
      current rollout, sweep, and verifier JSON directly and remember the
      folder when the browser permits it. You can also drop JSON files here
      or use <i>open files</i>.</p></div>`;
    return;
  }
  if (detail !== null && sessions[detail]) {
    const s = sessions[detail];
    if (s.kind === "episode") return renderEpisode(content, s);
    if (s.kind === "breakdown") return renderBreakdownDetail(content, s);
    return renderRaw(content, s, false);
  }
  if (tab === "runs") return renderRuns(content);
  if (tab === "breakdowns") return renderBreakdowns(content);
  return renderSweeps(content);
}

function backline(content, label) {
  const p = document.createElement("p");
  p.className = "backline";
  const a = document.createElement("a");
  a.className = "xref";
  a.tabIndex = 0;
  a.textContent = `← ${label}`;
  a.onclick = closeDetail;
  p.appendChild(a);
  p.appendChild(document.createTextNode(" (esc)"));
  content.appendChild(p);
}

/* ================= §1 Runs ================= */

function renderRuns(content) {
  const eps = byKind("episode");
  if (!eps.length) {
    content.innerHTML = `<p class="lede">No episode trajectories are loaded.
      They are written to <span class="mono">output/rollouts/</span> by
      <span class="mono">scripts.gaia2_cell_run</span>.</p>`;
    return;
  }
  const ok = eps.filter(s => s.data.verdict && s.data.verdict.success).length;
  const scenarios = [...new Set(eps.map(s => s.data.scenario_id))];
  const softCount = eps.filter(s => (s.data.judge || "scripted") !== "scripted").length;

  content.insertAdjacentHTML("beforeend",
    `<h2 class="sec">Runs</h2>
    <p class="lede"><b>${eps.length}</b> judged episodes over
    <b>${scenarios.length}</b> scenario${scenarios.length === 1 ? "" : "s"} —
    ${ok} success, <span class="${eps.length - ok ? "bad" : ""}">${eps.length - ok}
    failure</span>.</p>`);

  /* -- Table 1: the verdict matrix -- */
  const configs = [...new Set(eps.map(s => s.data.config))].sort((a, b) =>
    (a.startsWith("open") ? 0 : 1) - (b.startsWith("open") ? 0 : 1) || a.localeCompare(b));
  const wrap = document.createElement("div");
  wrap.innerHTML = `<p class="tcap"><b>Table 1:</b> Verdicts by scenario and
      configuration. Every mark opens its run's transcript.</p>
    <div class="tabwrap"><table class="tab">
    <thead><tr><th>scenario</th><th class="n">apps</th>${
      configs.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${scenarios.map(sc => {
      const mine = eps.filter(s => s.data.scenario_id === sc);
      const roster = (mine[0].data.roster || []).length;
      return `<tr><td>${esc(shortScenario(sc))}</td><td class="n">${roster}</td>${
        configs.map(cfg => {
          const runs = mine.filter(s => s.data.config === cfg)
            .sort((a, b) => String(a.data.started_at || "")
              .localeCompare(String(b.data.started_at || "")));
          if (!runs.length) return `<td class="wrapok"><span style="color:var(--faint)">—</span></td>`;
          return `<td class="wrapok">${runs.map(s => {
            const okr = !!(s.data.verdict && s.data.verdict.success);
            return `<a class="xref" data-i="${sessions.indexOf(s)}"
              tabindex="0" role="button"
              title="${esc(String(s.data.answer ?? ""))}">${
              verdictText(okr, s.data.judge)}${
              s.data.label ? ` <span class="runlab">${esc(s.data.label)}</span>` : ""}</a>`;
          }).join('<span style="color:var(--faint)"> · </span>')}</td>`;
        }).join("")}</tr>`;
    }).join("")}</tbody></table></div>
    <p class="tnote">✓ and ✗ are the benchmark's own write-action verdicts:
      the judge compares the agent's write calls against the scenario's gold
      writes, so ✗ means a gold write was missing, mismatched in its
      arguments, duplicated, or a later phase never unlocked — not that the
      harness errored.${softCount ? ` † judged by Gaia2's official soft judge
      (gpt-5.6-sol as checker); unmarked runs use the deterministic scripted
      judge. Two marks in one cell are the same cell under both judges.` : ""}</p>`;
  wrap.querySelectorAll("a[data-i]").forEach(a =>
    a.onclick = () => openDetail(Number(a.dataset.i)));
  content.appendChild(wrap);

  /* -- Table 2: every run, filterable -- */
  const abilities = [...new Set(eps.map(s => s.data.ability || "control"))];
  const judges = [...new Set(eps.map(s => s.data.judge || "scripted"))];

  content.insertAdjacentHTML("beforeend",
    `<p class="tcap"><b>Table 2:</b> All runs, with cost counters read from
     each trajectory: delegations, specialist turns, waits, blocked calls,
     and malformed protocol lines.</p>`);
  const fbar = document.createElement("div");
  fbar.className = "filterline";
  fbar.innerHTML = `<span>restrict to
      <input type="search" placeholder="any text" aria-label="filter runs"></span>
    <select data-f="verdict" aria-label="verdict"><option value="">any verdict</option>
      <option value="ok">success</option><option value="bad">failure</option></select>
    <select data-f="ability" aria-label="ability"><option value="">any ability</option>${
      abilities.map(a => `<option>${esc(a)}</option>`).join("")}</select>
    <select data-f="judge" aria-label="judge"><option value="">either judge</option>${
      judges.map(j => `<option>${esc(j)}</option>`).join("")}</select>
    <span class="count"></span>`;
  content.appendChild(fbar);

  const hasLabels = eps.some(s => s.data.label);
  const newestFirst = [...eps].sort((a, b) =>
    String(b.data.started_at || "").localeCompare(String(a.data.started_at || "")));
  const twrap = document.createElement("div");
  twrap.className = "tabwrap";
  twrap.innerHTML = `<table class="tab"><thead><tr>
      <th>when</th><th>scenario</th><th>configuration</th><th>ability</th>${
      hasLabels ? "<th>run</th>" : ""}<th>verdict</th>
      <th class="n">deleg</th><th class="n">turns</th><th>issues</th>
      <th>answer</th><th class="n">wall&nbsp;s</th>
    </tr></thead><tbody>${
    newestFirst.map(s => {
      const d = s.data, okr = !!(d.verdict && d.verdict.success);
      const mal = countMalformed(d);
      const issues = [
        d.blocked ? `${d.blocked} blocked` : "",
        mal ? `${mal} malformed` : "",
      ].filter(Boolean).join(" · ");
      return `<tr class="click" data-i="${sessions.indexOf(s)}" tabindex="0"
        data-verdict="${okr ? "ok" : "bad"}"
        data-ability="${esc(d.ability || "control")}"
        data-judge="${esc(d.judge || "scripted")}"
        data-text="${esc(JSON.stringify([d.scenario_id, d.config, d.ability,
                        d.judge, d.label, d.answer]).toLowerCase())}">
        <td>${fmtWhen(d.started_at)}</td>
        <td>${esc(shortScenario(d.scenario_id))}</td>
        <td>${esc(d.config || "")}</td>
        <td>${esc(d.ability || "control")}</td>${
        hasLabels ? `<td>${d.label ? esc(d.label) : "—"}</td>` : ""}
        <td>${verdictText(okr, d.judge)}</td>
        <td class="n">${d.delegations ?? ""}</td>
        <td class="n">${d.specialist_turns ?? ""}</td>
        <td>${issues ? `<span class="no">${esc(issues)}</span>`
                     : `<span style="color:var(--faint)">—</span>`}</td>
        <td title="${esc(d.answer ?? "")}">${esc(String(d.answer ?? "").slice(0, 44))}</td>
        <td class="n">${d.seconds ?? ""}</td></tr>`;
    }).join("")}</tbody></table>`;
  const trs = [...twrap.querySelectorAll("tr.click")];
  trs.forEach(tr => tr.onclick = () => openDetail(Number(tr.dataset.i)));
  const apply = () => {
    const q = $("input[type=search]", fbar).value.toLowerCase();
    const sel = {};
    for (const s of fbar.querySelectorAll("select")) sel[s.dataset.f] = s.value;
    let shown = 0;
    for (const tr of trs) {
      const hit = (!q || tr.dataset.text.includes(q))
        && (!sel.verdict || tr.dataset.verdict === sel.verdict)
        && (!sel.ability || tr.dataset.ability === sel.ability)
        && (!sel.judge || tr.dataset.judge === sel.judge);
      tr.style.display = hit ? "" : "none";
      shown += hit;
    }
    $(".count", fbar).textContent =
      shown === trs.length ? `all ${trs.length} runs` : `${shown} of ${trs.length} runs`;
  };
  fbar.addEventListener("input", apply);
  apply();
  content.appendChild(twrap);
}

/* ================= §2 Shipped-task runs ================= */

  if (!bds.length) {

    `<h2 class="sec">Shipped-task runs</h2>

     <span class="mono">jobs/</span> — ${ok} success,
     <span class="${bds.length - ok ? "bad" : ""}">${bds.length - ok} failure</span>.
     The reward is AppWorld's own per-requirement check.</p>
     <p class="tcap"><b>Table 3:</b> Verifier results by campaign and trial.</p>`);

      <input type="search" placeholder="any text" aria-label="filter runs"></span>

  const twrap = document.createElement("div");

      <th>campaign / trial</th><th>verdict</th><th class="n">partial</th>
      <th class="n">deleg</th><th>answer</th>
    </tr></thead><tbody>${

      const d = s.data, okr = !!d.success;

        data-text="${esc((s.path + " " + JSON.stringify([d.answer, d.partial])).toLowerCase())}">

    }).join("")}</tbody></table>`;
  const trs = [...twrap.querySelectorAll("tr.click")];
  trs.forEach(tr => tr.onclick = () => openDetail(Number(tr.dataset.i)));

function breakdownLabel(s) {
  const parts = s.path.split("/");
  return parts.length > 3 ? parts.slice(1, -2).join(" / ") : s.name;
}

/* ================= §3 Sweep evidence ================= */

function renderSweeps(content) {
  const sws = [...byKind("sweep"), ...byKind("raw")];
  if (!sws.length) {
    content.innerHTML = `<p class="lede">No sweep files are loaded.</p>`;
    return;
  }
  if (sweepSel >= sws.length) sweepSel = 0;

  content.insertAdjacentHTML("beforeend",
    `<h2 class="sec">Evidence files</h2>
     <p class="lede">The repository's measurement evidence from
     <span class="mono">sweep/</span> — one summary file per claim (the
     directory name is repo convention; these are not parameter sweeps).
     Column heads sort; the blank restricts.</p>`);

  const fbar = document.createElement("div");
  fbar.className = "filterline";
  fbar.innerHTML = `<span>file
      <select id="sweeppick" aria-label="evidence file">${
      sws.map((s, i) => `<option value="${i}"${i === sweepSel ? " selected" : ""}>${
        esc(s.name)}</option>`).join("")}</select></span>
    <span>restrict to <input type="search" placeholder="any text"
      aria-label="filter rows"></span>
    <span class="count"></span>`;
  content.appendChild(fbar);
  $("#sweeppick", fbar).addEventListener("change", e => {
    sweepSel = Number(e.target.value); render();
  });

  const s = sws[sweepSel];
  if (s.kind === "raw") { renderRaw(content, s, true); return; }

  const rows = Array.isArray(s.data) ? s.data : s.data.rows;
  const note = Array.isArray(s.data) ? null : s.data.note;
  const BULKY = new Set(["failed", "events", "ledger", "blocked_reasons", "seam_edges"]);
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))].filter(k => !BULKY.has(k));
  let sortKey = null, asc = true, query = "";

  content.insertAdjacentHTML("beforeend",
    `<p class="tcap"><b>Table 4:</b> <span class="mono">${esc(s.path)}</span></p>${
     note ? `<p class="tnote">${esc(note)}</p>` : ""}`);
  const twrap = document.createElement("div");
  twrap.className = "tabwrap";
  content.appendChild(twrap);

  const draw = () => {
    let data = [...rows];
    if (query) data = data.filter(r => JSON.stringify(r).toLowerCase().includes(query));
    $(".count", fbar).textContent =
      data.length === rows.length ? `all ${rows.length} rows`
                                  : `${data.length} of ${rows.length} rows`;
    if (sortKey !== null) data.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      const c = (typeof x === "number" && typeof y === "number") ? x - y
              : String(x ?? "").localeCompare(String(y ?? ""));
      return asc ? c : -c;
    });
    twrap.innerHTML = `<table class="tab wrap"><thead><tr>${
      cols.map(c => `<th class="sortable" data-k="${esc(c)}" tabindex="0"
        role="button" aria-label="sort by ${esc(c)}">${esc(c)}${
        c === sortKey ? (asc ? " ↑" : " ↓") : ""}</th>`).join("")
    }</tr></thead><tbody>${
      data.slice(0, 2000).map(r => `<tr>${cols.map(c => {
        const v = r[c];
        const num = typeof v === "number";
        const text = v == null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v));
        return `<td class="${num ? "n" : ""}" title="${esc(text)}">${esc(text.slice(0, 120))}</td>`;
      }).join("")}</tr>`).join("")
    }</tbody></table>` + (data.length > 2000
      ? `<p class="tnote">first 2000 matching rows shown</p>` : "");
    twrap.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      asc = (sortKey === k) ? !asc : true;
      sortKey = k;
      draw();
    });
  };
  fbar.addEventListener("input", e => {
    if (e.target.id === "sweeppick") return;
    query = $("input[type=search]", fbar).value.toLowerCase();
    draw();
  });
  draw();
}

function renderRaw(content, s, inline) {
  if (!inline) backline(content, "back to the tables");
  content.insertAdjacentHTML("beforeend",
    `<h3 class="subsec">${esc(s.name)}</h3>
     <p class="path">${esc(s.path)}</p>
     <pre class="blk">${esc(JSON.stringify(s.data, null, 1).slice(0, 400000))}</pre>`);
}

/* ================= run detail: the transcript ================= */

function renderEpisode(content, s) {
  const d = s.data;

    <p class="runmeta">Ability <i>${esc(d.ability || "control")}</i>;
      roster ${(d.roster || []).map(a => esc(a)).join(", ") || "—"};
      judged by the ${judge === "scripted"

      Main <span class="mono">${esc(d.main_model || "?")}</span>,
      specialists <span class="mono">${esc(d.sub_model || "?")}</span>${
      d.objective_action_contract
        ? `; contract <span class="mono">${esc(d.objective_action_contract)}</span>`

      ${d.user_turns ?? 0} user turn${(d.user_turns ?? 0) === 1 ? "" : "s"},
      ${d.blocked ? `<span class="bad">${d.blocked} blocked</span>` : "0 blocked"},

      ${d.seconds ?? "—"} s wall clock${
      d.started_at ? `, started ${esc(d.started_at)}` : ""}.
      ${d.answer != null ? `Final answer: <b>${esc(d.answer)}</b>.` : ""}</p>

      : (!okr ? `<p class="tnote">The scripted judge reports no rationale;
         ✗ failure means the agent's write calls did not match the scenario's

    ${(d.blocked_reasons || []).length

  content.appendChild(meta);

  const types = [...new Set((d.events || []).map(e => e.type))];
  const fbar = document.createElement("div");
  fbar.className = "filterline";
  fbar.innerHTML = `<span>restrict to
      <input type="search" placeholder="any text" aria-label="filter events"></span>` +
    types.map(t => `<label class="t"><input type="checkbox" checked
      data-t="${esc(t)}"> ${esc(t)}</label>`).join("");
  content.appendChild(fbar);

  const list = document.createElement("div");
  list.className = "transcript";
  content.appendChild(list);
  const cards = (d.events || []).map(e => turnNode(e));
  batchAppend(list, cards);

  const apply = () => {
    const q = $("input[type=search]", fbar).value.toLowerCase();
    const on = new Set([...fbar.querySelectorAll("input[data-t]:checked")].map(i => i.dataset.t));
    for (const c of cards)
      c.style.display = ((!q || c.dataset.text.includes(q)) && on.has(c.dataset.type)) ? "" : "none";
  };
  fbar.addEventListener("input", apply);
}

function callHtml(c) {
  if (c.status === "malformed" || c.status === "false-outage") {
    const label = c.status === "malformed" ? "unparseable line —"
      : "rejected false outage claim —";
    return `<div class="call"><span class="flag">${label}</span>
      <span class="sig">${esc(String(c.raw ?? c.result ?? "").slice(0, 400))}</span></div>`;
  }
  const flag = c.status === "ok" ? "" : ` <span class="flag">${esc(c.status)}</span>`;
  return `<div class="call"><div class="sig">${esc(c.tool)}(${esc(JSON.stringify(c.args))})${flag}</div>
    <pre>${esc(c.result ?? "")}</pre></div>`;
}

/* One event, set as a dialogue turn: speaker in the margin, matter in the
   text column. Waits, notifications and stops are stage directions. */
function turnNode(e) {
  const div = document.createElement("div");
  let cls = "turn", spk = e.type, body = "";
  const time = e.sim_time ? `<span class="t">${esc(e.sim_time.slice(11))}</span>` : "";

  if (e.type === "user") { spk = "user"; body = esc(e.content ?? ""); }
  else if (e.type === "main") { spk = "main"; body = esc(e.content ?? ""); }
  else if (e.type === "send_user") { spk = "main → user"; body = esc(e.content ?? ""); }
  else if (e.type === "notification") {
    spk = "world"; cls += " stage"; body = esc(e.content ?? "");
  } else if (e.type === "wait") {
    spk = "clock"; cls += " stage";
    body = (e.arrived || []).length
      ? `[waits ${esc(String(e.requested ?? "?"))} s — ${esc((e.arrived || []).join("; "))}]`
      : `[waits ${esc(String(e.requested ?? "?"))} s; nothing arrives]`;
  } else if (e.type === "done") { spk = "done"; body = esc(e.answer ?? ""); }
  else if (e.type === "surrender") {
    spk = "fail"; cls += " fail";
    body = esc(e.reason ?? "") + `\n(honest surrender — reported to the user)`;
  } else if (e.type === "stop") {
    spk = "world"; cls += " stage fail"; body = "[the environment stops]";
  } else if (e.type === "delegation") {
    spk = `main → ${e.specialist ?? "?"}`;
    const calls = e.calls || [];
    const bad = calls.filter(c => c.status !== "ok").length;
    body = esc(e.brief ?? "") +
      `<div class="report"><b>${esc(e.specialist ?? "")}:</b> ${esc(e.report ?? "")}</div>` +
      (calls.length
        ? `<details class="calls"><summary>${calls.length} tool call${
            calls.length > 1 ? "s" : ""}${bad ? ` <span class="no">(${bad} faulted)</span>` : ""
          }</summary>${calls.map(callHtml).join("")}</details>`
        : "");
  } else if (e.type === "call") {
    spk = "main"; body = callHtml(e);
  }

  div.className = cls;
  div.innerHTML = `<div class="spk">${esc(spk)}${time}</div><div class="txt">${body}</div>`;
  div.dataset.type = e.type;
  div.dataset.text = JSON.stringify(e).toLowerCase();
  return div;
}

/* ================= breakdown detail ================= */

function renderBreakdownDetail(content, s) {
  const d = s.data;
  backline(content, "back to the tables");
  const meta = document.createElement("div");
  meta.innerHTML = `
    <h3 class="subsec">${esc(breakdownLabel(s))} — ${verdictText(!!d.success)}</h3>
    <p class="path">${esc(s.path)}</p>
    <p class="runmeta">Partial reward ${d.partial ?? "—"}${
      d.passes != null ? ` (${d.passes} requirement${d.passes === 1 ? "" : "s"} passed,
      ${d.failures ?? "?"} failed)` : ""};
      ${d.delegations ?? d.ledger.length} delegations,
      ${d.ledger.reduce((n, l) => n + (l.specialist_turns || 0), 0)} specialist turns,
      ${d.ledger.reduce((n, l) => n + (l.blocked || 0), 0)} blocked.
      ${d.answer != null ? `Final answer: <b>${esc(d.answer)}</b>.` : ""}</p>
    ${(d.failed || []).length ? `<details class="calls"><summary>${d.failed.length}
      failed requirement${d.failed.length > 1 ? "s" : ""}</summary>
      <pre class="blk">${esc(d.failed.join("\n\n"))}</pre></details>` : ""}`;
  content.appendChild(meta);

  const list = document.createElement("div");
  list.className = "transcript";
  content.appendChild(list);
  batchAppend(list, d.ledger.map(l => {
    const div = document.createElement("div");
    div.className = "turn";
    div.innerHTML = `<div class="spk">main → ${esc(l.specialist)}</div>
      <div class="txt">${esc(l.brief ?? "")}
        <div class="report"><b>${esc(l.specialist)}:</b> ${esc(l.report ?? "")}
          <i>(${esc(String(l.specialist_turns ?? "?"))} turns${
          l.blocked ? `, <span class="no">${l.blocked} blocked</span>` : ""}${
          l.refused ? `, ${l.refused} refused` : ""})</i></div>
        ${(l.blocked_reasons || []).length
          ? `<div class="report">Blocked: ${esc(l.blocked_reasons.join(" · "))}</div>` : ""}</div>`;
    return div;
  }));
}

/* ================= startup: live repository, snapshot fallback ================= */

async function startup() {
  const el = document.getElementById("embedded-logs");
  const fallback = [];
  if (el) {
    let snap = null;
    try { snap = JSON.parse(el.textContent); } catch { snap = null; }
    if (snap && Array.isArray(snap.files) && snap.files.length) {
      for (const f of snap.files) {
        fallback.push(artifact(f.path.split("/").pop(), f.path, f.data));
      }
      activateArtifacts(fallback);
      sourceLine = `snapshot of ${snap.generated}, ${snap.files.length} artifacts`;
    }
  }
  render();

  if (!("showDirectoryPicker" in window)) {
    $("#connect").textContent = "select repository folder";
    return;
  }
  liveHandle = await savedHandle();
  if (!liveHandle) return;
  if (await hasReadPermission(liveHandle, false)) {
    await refreshRepository(false);
  } else {
    liveNeedsPermission = true;
    $("#connect").textContent = "reconnect repository";
    sourceLine = fallback.length
      ? `${sourceLine}; live repository permission needs renewal`
      : "saved repository permission needs renewal";
    render();
  }
}

window.addEventListener("focus", () => {
  if (liveHandle && !pickingRepository
      && Date.now() - lastLiveLoad > 5_000) {
    refreshRepository(false);
  }
});
window.setInterval(() => {
  if (liveHandle && !pickingRepository
      && document.visibilityState === "visible"
      && Date.now() - lastLiveLoad > 30_000) {
    refreshRepository(false);
  }
}, 30_000);

startup();
</script>
