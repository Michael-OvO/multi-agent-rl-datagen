[project]
name = "rl-datagen"
version = "0.1.0"
description = "Multi-agent foundational-capability RL task forge (Harbor format)"
requires-python = ">=3.11"

# Pinned to exactly what forge/appworld/container/Dockerfile.sidecar installs.
#
# These are not dev conveniences -- this is the environment the AppWorld
# measurements in WRITEUP.md were taken in. If they drift from the sidecar, that
# sweep measures a different AppWorld than the shipped task runs and nothing
# would say so. forge/tests/test_environment.py fails if they stop matching.
#
# This is *not* the environment the current campaign runs in. Gaia2 is the
# substrate now, it needs pydantic 2, and appworld resolves pydantic 1 -- so the
# two cannot share an interpreter. Gaia2's environment is requirements-gaia2.txt
# and lives in .venv-gaia2; see the README, and the Gaia2 half of
# forge/tests/test_environment.py. AppWorld stays declared here because
# scripts/appworld_*.py and forge/appworld/ still import it: the probes that
# produced WRITEUP.md have to keep running, or those numbers become unbacked.
dependencies = [
    "appworld==0.1.3.post1",
    "openai==2.16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["forge/tests"]

[tool.pyright]
include = [
    "forge/abilities.py",
    "forge/appworld",
    "forge/factory",
    "forge/forge_cli.py",
    "forge/gaia2",
    "forge/maf",
    "scripts",
]
exclude = ["forge/tests", "tasks"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
