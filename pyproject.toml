[project]
name = "kimi-rl-datagen"
version = "0.1.0"
description = "Multi-agent foundational-capability RL task forge (Harbor format)"
requires-python = ">=3.11"

# Pinned to exactly what forge/appworld/container/Dockerfile.sidecar installs.
#
# These are not dev conveniences -- this is the environment every measurement in
# WRITEUP.md was taken in. If they drift from the sidecar, the sweep measures a
# different AppWorld than the shipped task runs and nothing would say so.
# forge/tests/test_environment.py fails if they stop matching.
dependencies = [
    "appworld==0.1.3.post1",
    "openai==2.16.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["forge/tests"]
