services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    depends_on:
      maf-env:
        # Wait for the sidecar to be READY, not merely started. AppWorld's world
        # takes seconds to load; a plain `depends_on` let the verifier fire
        # first and report "cannot reach the sidecar" on a task that was fine.
        condition: service_healthy

  maf-env:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    environment:
      MAF_TASK_ID: "2a163ab_3"
      MAF_CONFIG: '{"task_id": "2a163ab_3", "roster": ["phone", "venmo"], "topology": "star", "visibility": "docs", "delegation_budget": null}'
      MAF_VERIFIER_TOKEN: "517aacf5eb4711592cce8387199986f6"
      # Both roles default to the frontier series. The sidecar refuses to
      # start a specialist below the Main's model class (forge/models.py), so
      # overriding MAF_SUB_MODEL downward is a startup error, not a silent
      # downgrade of what the task measures -- unless the operator also sets
      # MAF_ALLOW_SUB_DOWNGRADE=1, which makes it a deliberate, labelled one.
      MAF_MAIN_MODEL: "${MAF_MAIN_MODEL:-gpt-5.6-sol}"
      MAF_SUB_MODEL: "${MAF_SUB_MODEL:-gpt-5.6-sol}"
      MAF_ALLOW_SUB_DOWNGRADE: "${MAF_ALLOW_SUB_DOWNGRADE:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    expose:
      - "8079"
    healthcheck:
      # /health, not /roster: /roster executes the API catalog against the live
      # world, and this fires every 3s for the life of the episode.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8079/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
